# Two lists render as two sections:
#   main      -> "Publications"          (journal articles and preprints)
#   abstracts -> "Conference Abstracts"  (meeting abstracts / posters)
#
# Keeping abstracts separate is the honest convention — an ISMRM or BMES
# abstract is a real contribution but is not a peer-reviewed paper, and listing
# them together overstates the record.
#
# Field reference (only `title` and `authors` are required):
#   title            - wrap in "quotes" if it contains a colon
#   authors          - full list; wrap Quanhao's name in <strong></strong>
#   conference       - full venue string, italicised under the authors
#   conference_short - short badge, only shows when `image` is also set
#   pdf              - DOI/arXiv link; also makes the title clickable
#   code             - repository link                           (optional)
#   page             - project page link                         (optional)
#   bibtex           - link to a .txt file of the BibTeX entry    (optional)
#   image            - teaser thumbnail, ~600px wide              (optional)
#   notes            - highlight in orange, e.g. "Oral Presentation"

main:

